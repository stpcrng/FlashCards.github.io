<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Flashcards</title>
    <style>
        :root {
            --bg-color: #0f172a; /* Глубокий темный фон */
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        /* Кнопка загрузки файла */
        .file-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* Контейнер карточки (3D эффект) */
        .card-container {
            width: 100%;
            max-width: 400px;
            height: 250px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-color: var(--card-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-front {
            font-size: 2rem;
            font-weight: bold;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #1e293b;
        }

        .translation {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .example {
            font-size: 1rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Управление */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
        }

        .progress {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Адаптивность для телефонов */
        @media (max-width: 480px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            .card-container {
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>My Flashcards</h1>
        <div class="file-upload">
            <button class="btn">Загрузить .json</button>
            <input type="file" id="jsonUpload" accept=".json">
        </div>
    </header>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-front">
                <span id="wordDisplay">Loading...</span>
            </div>
            <div class="card-face card-back">
                <div class="translation" id="translationDisplay"></div>
                <div class="example" id="exampleDisplay"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="prevCard()">&#8592; Назад</button>
        <button class="btn" onclick="nextCard()">Вперед &#8594;</button>
    </div>

    <div class="progress" id="progressDisplay">0 / 0</div>

    <!-- Подключаем дефолтные слова -->
    <script src="cards.js"></script>
    <script>
        let currentCards = [];
        let currentIndex = 0;

        // Инициализация при загрузке страницы
        window.onload = () => {
            if (typeof defaultCards !== 'undefined') {
                currentCards = defaultCards;
                updateCard();
            }
        };

        function updateCard() {
            if (currentCards.length === 0) return;
            
            const cardElement = document.getElementById('flashcard');
            // Сбрасываем переворот при смене карточки
            cardElement.classList.remove('is-flipped');

            // Небольшая задержка, чтобы текст не менялся в момент анимации переворота обратно
            setTimeout(() => {
                const currentData = currentCards[currentIndex];
                document.getElementById('wordDisplay').textContent = currentData.word;
                document.getElementById('translationDisplay').textContent = currentData.translation;
                document.getElementById('exampleDisplay').textContent = currentData.example;
                
                document.getElementById('progressDisplay').textContent = `${currentIndex + 1} / ${currentCards.length}`;
            }, 150);
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('is-flipped');
        }

        function nextCard() {
            if (currentIndex < currentCards.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                currentIndex = 0; // Начинаем сначала, если дошли до конца
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        // Логика загрузки пользовательского JSON
        document.getElementById('jsonUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const uploadedCards = JSON.parse(e.target.result);
                    if (Array.isArray(uploadedCards) && uploadedCards.length > 0) {
                        currentCards = uploadedCards;
                        currentIndex = 0;
                        updateCard();
                        alert('Слова успешно загружены!');
                    } else {
                        alert('Файл пуст или имеет неверный формат массива.');
                    }
                } catch (error) {
                    alert('Ошибка чтения JSON файла. Проверьте синтаксис.');
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
