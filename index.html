<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Flashcards</title>
    <style>
        :root {
            --bg: #0b0f1a;
            --card-bg: #161b2c;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: pan-y; /* Позволяет вертикальный скролл, но мы будем ловить горизонтальные свайпы */
        }

        /* Top Bar */
        header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo { font-weight: 800; letter-spacing: -0.5px; color: var(--accent); }

        /* Main Layout */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Flashcard Logic */
        .stage {
            perspective: 1200px;
            width: 100%;
            max-width: 450px;
            height: 300px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: var(--card-bg);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card-front { font-size: 2.5rem; font-weight: 700; }
        .card-back { transform: rotateY(180deg); background: #1a2035; }

        .translation { font-size: 1.8rem; color: var(--accent); margin-bottom: 1rem; }
        .example { font-size: 1rem; color: var(--text-dim); line-height: 1.5; }

        /* Controls */
        .action-bar {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            width: 100%;
            max-width: 450px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn:hover { transform: translateY(-2px); background: #232a42; }
        .btn-primary { background: var(--accent); box-shadow: 0 4px 15px var(--accent-glow); }
        .btn-primary:hover { background: #5558e6; }

        /* Settings Sidebar */
        .settings-panel {
            position: fixed;
            right: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: #111522;
            z-index: 100;
            padding: 2rem;
            transition: right 0.3s ease;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .settings-panel.active { right: 0; }

        .setting-item { margin-bottom: 1.5rem; }
        .setting-item label { display: block; margin-bottom: 0.5rem; color: var(--text-dim); font-size: 0.8rem; }

        /* Status Indicator */
        .kbs-hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.75rem;
            color: var(--text-dim);
            opacity: 0.6;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .animate-card { animation: slideIn 0.3s ease-out; }
    </style>
</head>
<body>

    <header>
        <div class="logo">FLASH_DEV v2.0</div>
        <div>
            <button class="btn" onclick="toggleSettings()" style="padding: 8px 15px;">⚙️ Настройки</button>
        </div>
    </header>

    <main id="swipeArea">
        <div class="stage">
            <div class="card" id="card" onclick="flip()">
                <div class="card-face card-front" id="f-face">Word</div>
                <div class="card-face card-back">
                    <div class="translation" id="b-trans">Translation</div>
                    <div class="example" id="b-ex">Example sentence...</div>
                    <button class="btn" onclick="speak(); event.stopPropagation();" style="margin-top:15px; font-size: 0.8rem;">🔊 Прослушать</button>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn" onclick="prev()">← Назад</button>
            <button class="btn btn-primary" onclick="next()">Следующее →</button>
        </div>

        <div class="progress" id="counter" style="margin-top: 15px; color: var(--text-dim);">0 / 0</div>
        <div class="kbs-hint">Space: Flip | Arrows: Nav | S: Shuffle</div>
    </main>

    <div class="settings-panel" id="settings">
        <h2 style="margin-bottom: 1.5rem;">Настройки</h2>
        
        <div class="setting-item">
            <label>ИМПОРТ ДАННЫХ</label>
            <input type="file" id="importJson" accept=".json" style="display: none;">
            <button class="btn" onclick="document.getElementById('importJson').click()" style="width: 100%;">Загрузить JSON</button>
        </div>

        <div class="setting-item">
            <label>РЕЖИМЫ</label>
            <button class="btn" id="shuffleBtn" onclick="toggleShuffle()" style="width: 100%;">Перемешать: ВЫКЛ</button>
        </div>

        <div class="setting-item">
            <label>ГОЛОС (Web Speech)</label>
            <select id="voiceSelect" class="btn" style="width: 100%; text-align: left;"></select>
        </div>

        <button class="btn btn-primary" onclick="toggleSettings()" style="width: 100%; margin-top: 2rem;">Закрыть</button>
    </div>

    <script src="cards.js"></script>
    <script>
        let cards = [];
        let index = 0;
        let isShuffled = false;
        let originalOrder = [];

        // Инициализация
        window.onload = () => {
            cards = [...defaultCards];
            originalOrder = [...defaultCards];
            loadVoices();
            render();
            setupSwipes();
        };

        function render() {
            if (!cards.length) return;
            const item = cards[index];
            const cardEl = document.getElementById('card');
            
            cardEl.classList.remove('is-flipped', 'animate-card');
            void cardEl.offsetWidth; // Trigger reflow
            cardEl.classList.add('animate-card');

            document.getElementById('f-face').textContent = item.word;
            document.getElementById('b-trans').textContent = item.translation;
            document.getElementById('b-ex').textContent = item.example;
            document.getElementById('counter').textContent = `${index + 1} / ${cards.length}`;
        }

        // Управление
        const flip = () => document.getElementById('card').classList.toggle('is-flipped');
        const next = () => { index = (index + 1) % cards.length; render(); };
        const prev = () => { index = (index - 1 + cards.length) % cards.length; render(); };

        // Настройки
        const toggleSettings = () => document.getElementById('settings').classList.toggle('active');
        
        function toggleShuffle() {
            isShuffled = !isShuffled;
            const btn = document.getElementById('shuffleBtn');
            if (isShuffled) {
                cards = [...cards].sort(() => Math.random() - 0.5);
                btn.textContent = "Перемешать: ВКЛ";
                btn.style.borderColor = "var(--accent)";
            } else {
                cards = [...originalOrder];
                btn.textContent = "Перемешать: ВЫКЛ";
                btn.style.borderColor = "transparent";
            }
            index = 0;
            render();
        }

        // Горячие клавиши (Keyboard Management)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); flip(); }
            if (e.code === 'ArrowRight') next();
            if (e.code === 'ArrowLeft') prev();
            if (e.code === 'KeyS') toggleShuffle();
            if (e.code === 'Escape') document.getElementById('settings').classList.remove('active');
        });

        // Озвучка
        function loadVoices() {
            const vs = document.getElementById('voiceSelect');
            speechSynthesis.onvoiceschanged = () => {
                const voices = speechSynthesis.getVoices().filter(v => v.lang.includes('en'));
                vs.innerHTML = voices.map(v => `<option value="${v.name}">${v.name}</option>`).join('');
            };
        }

        function speak() {
            const text = cards[index].word;
            const msg = new SpeechSynthesisUtterance(text);
            const voiceName = document.getElementById('voiceSelect').value;
            msg.voice = speechSynthesis.getVoices().find(v => v.name === voiceName);
            speechSynthesis.speak(msg);
        }

        // Свайпы для мобильных
        function setupSwipes() {
            let touchStartX = 0;
            const area = document.getElementById('swipeArea');
            area.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
            area.addEventListener('touchend', e => {
                let diff = e.changedTouches[0].screenX - touchStartX;
                if (Math.abs(diff) > 50) diff > 0 ? prev() : next();
            });
        }

        // Загрузка JSON
        document.getElementById('importJson').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                cards = JSON.parse(event.target.result);
                originalOrder = [...cards];
                index = 0;
                render();
                toggleSettings();
            };
            reader.readAsText(e.target.files[0]);
        });
    </script>
</body>
</html>
